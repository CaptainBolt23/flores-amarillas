<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un pequeño regalo para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FFFCF0;
  --gold-deep: #B8820E;
  --text: #3B2800;
}
body {
  font-family: 'Jost', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(245,192,48,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 70%, rgba(245,192,48,0.08) 0%, transparent 55%);
  pointer-events: none;
}
.fp {
  position: fixed; pointer-events: none;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  opacity: 0; animation: floatUp linear infinite; z-index: 0;
}
@keyframes floatUp {
  0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
  6%   { opacity: 0.4; }
  94%  { opacity: 0.3; }
  100% { transform: translateY(-10vh) rotate(380deg); opacity: 0; }
}
.card {
  position: relative; z-index: 1;
  text-align: center; width: 100%; max-width: 420px;
}
.pretitle {
  font-size: 11px; font-weight: 500; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold-deep);
  opacity: 0; animation: fadeUp 0.9s ease 0.2s forwards;
  margin-bottom: 0.6rem;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 7vw, 3rem); font-weight: 600;
  color: var(--text); line-height: 1.2;
  opacity: 0; animation: fadeUp 0.9s ease 0.4s forwards;
  margin-bottom: 1.5rem;
}
h1 em { font-style: italic; color: var(--gold-deep); }
#bouquet { width: 100%; margin: 0 auto 2rem; }
#bouquet svg { width: 100%; height: auto; display: block; }
.divider {
  opacity: 0; animation: fadeIn 0.8s ease 1.9s forwards;
  display: flex; align-items: center; gap: 12px;
  max-width: 300px; margin: 0 auto 1.6rem;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(184,130,14,0.25);
}
.divider span { font-size: 13px; color: var(--gold-deep); opacity: 0.55; }
.quote {
  opacity: 0; animation: fadeUp 0.9s ease 2.1s forwards;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(1.25rem, 4vw, 1.65rem); color: var(--text);
  line-height: 1.55; max-width: 420px; margin: 0 auto 0.8rem;
}
.quote-sig {
  opacity: 0; animation: fadeUp 0.8s ease 2.3s forwards;
  font-family: 'Jost', sans-serif; font-size: 0.7rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-deep);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <p class="pretitle">para ti, con cariño</p>
  <h1>Un pequeño <em>regalo</em><br>para ti</h1>

  <div id="bouquet">
    <svg viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">

      <!-- Cada flor usa animateTransform con additive="sum" para escalar desde su propio centro -->

            <ellipse cx="25" cy="155" rx="8"  ry="19" fill="#E6A800" opacity="0.7" transform="rotate(225,25,155)"/>
            <ellipse cx="21" cy="138" rx="7"  ry="17" fill="#FFD93D" transform="rotate(-90,21,138)"/>

      </g>

      <!-- FLOR 4 — der media, x=192 y=105 -->
      <g>
        <g transform="translate(192,105)">
          <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.25s" dur="0.6s" calcMode="spline" keySplines="0.2 1.2 0.4 1" fill="freeze" additive="sum"/>
          <path d="M0,12 Q7,65 3,108" stroke="#3A6B2A" stroke-width="2.9" fill="none" stroke-linecap="round"/>
          <ellipse cx="14" cy="68" rx="10" ry="4" fill="#4A8C38" transform="rotate(-40,14,68)"/>

        </g>
      </g>

      <!-- FLOR 5 — der pequeña, x=238 y=138 -->
      <g>
        <g transform="translate(238,138)">
          <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.4s" dur="0.6s" calcMode="spline" keySplines="0.2 1.2 0.4 1" fill="freeze" additive="sum"/>
          <path d="M0,10 Q6,52 2,88" stroke="#2E5720" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="12" cy="54" rx="8" ry="3.5" fill="#4A8C38" transform="rotate(-40,12,54)"/>
          <ellipse cx="-22" cy="0"   rx="7" ry="18" fill="#F9A825" opacity="0.7" transform="rotate(-90,-22,0)"/>
          <ellipse cx="-16" cy="-16" rx="7" ry="18" fill="#F9A825" opacity="0.7" transform="rotate(-45,-16,-16)"/>

          <ellipse cx="16"  cy="-16" rx="7" ry="18" fill="#F9A825" opacity="0.7" transform="rotate(45,16,-16)"/>
          <ellipse cx="22"  cy="0"   rx="7" ry="18" fill="#F9A825" opacity="0.7" transform="rotate(90,22,0)"/>

      <!-- FLOR 6 — centro bajo pequeña, x=140 y=162 -->
      <g>
        <g transform="translate(140,162)">
          <animateTransform attributeName="transform" type="scale" from="0" to="1" begin="1.55s" dur="0.6s" calcMode="spline" keySplines="0.2 1.2 0.4 1" fill="freeze" additive="sum"/>

  </div>

  <div class="divider"><span>✦</span></div>
  <p class="quote">Te mereces flores<br>sin ser un día especial.</p>
  <p class="quote-sig">— con todo el cariño del mundo</p>
</div>

<script>
(function(){
  const cols = ['#FFD93D','#FFC300','#FFE55C','#F5C030','#FFEA70'];
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  for (let i=0; i<20; i++) {
    const el = document.createElement('div');
    el.className = 'fp';
    const s = rnd(7,20);
    el.style.cssText =
      `left:${rnd(0,100)}%;width:${s}px;height:${s*0.55}px;` +
      `background:${pick(cols)};` +
      `animation-duration:${rnd(14,30)}s;animation-delay:${rnd(0,24)}s`;
    document.body.appendChild(el);
  }
}());
</script>
</body>
</html>
