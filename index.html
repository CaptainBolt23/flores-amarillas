<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un pequeño regalo para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FFFCF0;
  --gold-deep: #B8820E;
  --text: #3B2800;
}
body {
  font-family: 'Jost', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(245,192,48,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 75% 70%, rgba(245,192,48,0.08) 0%, transparent 55%);
  pointer-events: none;
}
.fp {
  position: fixed; pointer-events: none;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  opacity: 0; animation: floatUp linear infinite; z-index: 0;
}
@keyframes floatUp {
  0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
  6%   { opacity: 0.4; }
  94%  { opacity: 0.3; }
  100% { transform: translateY(-10vh) rotate(380deg); opacity: 0; }
}
.card {
  position: relative; z-index: 1;
  text-align: center; width: 100%; max-width: 500px;
}
.pretitle {
  font-size: 11px; font-weight: 500; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--gold-deep);
  opacity: 0; animation: fadeUp 0.9s ease 0.2s forwards;
  margin-bottom: 0.6rem;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 7vw, 3rem); font-weight: 600;
  color: var(--text); line-height: 1.2;
  opacity: 0; animation: fadeUp 0.9s ease 0.4s forwards;
  margin-bottom: 1.5rem;
}
h1 em { font-style: italic; color: var(--gold-deep); }

#bouquet {
  width: 100%; margin: 0 auto 2rem;
  opacity: 0; animation: fadeIn 0.5s ease 0.6s forwards;
}

/* Cada flor aparece con bloom escalonado */
.f1 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 0.9s both; }
.f2 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 1.05s both; }
.f3 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 1.20s both; }
.f4 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 1.35s both; }
.f5 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 1.50s both; }
.f6 { animation: bloom 0.7s cubic-bezier(.2,1.2,.4,1) 1.65s both; }

.divider {
  opacity: 0; animation: fadeIn 0.8s ease 1.9s forwards;
  display: flex; align-items: center; gap: 12px;
  max-width: 300px; margin: 0 auto 1.6rem;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(184,130,14,0.25);
}
.divider span { font-size: 13px; color: var(--gold-deep); opacity: 0.55; }
.quote {
  opacity: 0; animation: fadeUp 0.9s ease 2.1s forwards;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: clamp(1.25rem, 4vw, 1.65rem); color: var(--text);
  line-height: 1.55; max-width: 420px; margin: 0 auto 0.8rem;
}
.quote-sig {
  opacity: 0; animation: fadeUp 0.8s ease 2.3s forwards;
  font-family: 'Jost', sans-serif; font-size: 0.7rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-deep);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bloom {
  0%   { transform: scale(0) rotate(-8deg); opacity: 0; }
  60%  { transform: scale(1.1) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
</style>
</head>
<body>
<div class="card">
  <p class="pretitle">para ti, con cariño</p>
  <h1>Un pequeño <em>regalo</em><br>para ti</h1>

  <div id="bouquet">
    <svg viewBox="0 0 400 320" width="100%" xmlns="http://www.w3.org/2000/svg">

      <!-- Flor 1 -->

        <ellipse cx="18" cy="85" rx="11" ry="5" fill="#4A8C38" transform="rotate(-40,18,85)"/>

        <ellipse cx="40" cy="0" rx="14" ry="32" fill="#F5A623" opacity="0.7" transform="rotate(90,40,0)"/>

        <ellipse cx="-36" cy="0" rx="13" ry="29" fill="#FFE55C" transform="rotate(-90,-36,0)"/>
        <ellipse cx="-25" cy="-25" rx="13" ry="29" fill="#FFE55C" transform="rotate(-45,-25,-25)"/>
        <ellipse cx="0" cy="-36" rx="13" ry="29" fill="#FFE55C" transform="rotate(0,0,-36)"/>
        <ellipse cx="25" cy="-25" rx="13" ry="29" fill="#FFE55C" transform="rotate(45,25,-25)"/>
        <ellipse cx="36" cy="0" rx="13" ry="29" fill="#FFE55C" transform="rotate(90,36,0)"/>

      <!-- Flor 3 (centro, más grande) -->
      <g transform="translate(245,100)" class="f3">

        <ellipse cx="-38" cy="0" rx="14" ry="31" fill="#FFF176" transform="rotate(-90,-38,0)"/>
        <ellipse cx="-27" cy="-27" rx="14" ry="31" fill="#FFF176" transform="rotate(-45,-27,-27)"/>
        <ellipse cx="0" cy="-38" rx="14" ry="31" fill="#FFF176" transform="rotate(0,0,-38)"/>
        <ellipse cx="27" cy="-27" rx="14" ry="31" fill="#FFF176" transform="rotate(45,27,-27)"/>

      <!-- Flor 4 -->
      <g transform="translate(330,130)" class="f4">
        <path d="M0,13 Q9,75 4,125" stroke="#3A6B2A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="16" cy="78" rx="10" ry="4.5" fill="#4A8C38" transform="rotate(-40,16,78)"/>
        <ellipse cx="-34" cy="0" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(-90,-34,0)"/>
        <ellipse cx="-24" cy="-24" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(-45,-24,-24)"/>
        <ellipse cx="0" cy="-34" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(0,0,-34)"/>
        <ellipse cx="24" cy="-24" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(45,24,-24)"/>
        <ellipse cx="34" cy="0" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(90,34,0)"/>
        <ellipse cx="24" cy="24" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(135,24,24)"/>
        <ellipse cx="0" cy="34" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(180,0,34)"/>
        <ellipse cx="-24" cy="24" rx="11" ry="26" fill="#E6A800" opacity="0.7" transform="rotate(225,-24,24)"/>
        <ellipse cx="-30" cy="0" rx="10" ry="23" fill="#FFE082" transform="rotate(-90,-30,0)"/>
        <ellipse cx="-21" cy="-21" rx="10" ry="23" fill="#FFE082" transform="rotate(-45,-21,-21)"/>
        <ellipse cx="0" cy="-30" rx="10" ry="23" fill="#FFE082" transform="rotate(0,0,-30)"/>
        <ellipse cx="21" cy="-21" rx="10" ry="23" fill="#FFE082" transform="rotate(45,21,-21)"/>
        <ellipse cx="30" cy="0" rx="10" ry="23" fill="#FFE082" transform="rotate(90,30,0)"/>

      <!-- Flor 5 pequeña izquierda -->
      <g transform="translate(120,178)" class="f5">
        <path d="M0,11 Q-6,60 -2,100" stroke="#2E5720" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <ellipse cx="-16" cy="62" rx="9" ry="4" fill="#4A8C38" transform="rotate(-140,-16,62)"/>
        <ellipse cx="-28" cy="0" rx="9" ry="21" fill="#F9A825" opacity="0.7" transform="rotate(-90,-28,0)"/>

        <ellipse cx="-25" cy="0" rx="8" ry="19" fill="#FFD93D" transform="rotate(-90,-25,0)"/>
        <ellipse cx="-18" cy="-18" rx="8" ry="19" fill="#FFD93D" transform="rotate(-45,-18,-18)"/>
        <ellipse cx="0" cy="-25" rx="8" ry="19" fill="#FFD93D" transform="rotate(0,0,-25)"/>
        <ellipse cx="18" cy="-18" rx="8" ry="19" fill="#FFD93D" transform="rotate(45,18,-18)"/>
        <ellipse cx="25" cy="0" rx="8" ry="19" fill="#FFD93D" transform="rotate(90,25,0)"/>

      </g>

      <!-- Flor 6 pequeña derecha -->
      <g transform="translate(285,168)" class="f6">
        <path d="M0,10 Q7,55 3,95" stroke="#487A36" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="14" cy="58" rx="8" ry="3.5" fill="#4A8C38" transform="rotate(-40,14,58)"/>
        <ellipse cx="-26" cy="0" rx="8" ry="20" fill="#FFB300" opacity="0.7" transform="rotate(-90,-26,0)"/>

    </svg>
  </div>

  <div class="divider"><span>✦</span></div>
  <p class="quote">Te mereces flores<br>sin ser un día especial.</p>
  <p class="quote-sig">— con todo el cariño del mundo</p>
</div>

<script>
(function(){
  const cols = ['#FFD93D','#FFC300','#FFE55C','#F5C030','#FFEA70'];
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  for (let i=0; i<20; i++) {
    const el = document.createElement('div');
    el.className = 'fp';
    const s = rnd(7,20);
    el.style.cssText =
      `left:${rnd(0,100)}%;` +
      `width:${s}px;height:${s*0.55}px;` +
      `background:${pick(cols)};` +
      `animation-duration:${rnd(14,30)}s;` +
      `animation-delay:${rnd(0,24)}s`;
    document.body.appendChild(el);
  }
}());
</script>
</body>
</html>
